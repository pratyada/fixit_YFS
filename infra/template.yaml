AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FIXIT - AI Health Tracker (S3 + CloudFront + Lambda API)

Parameters:
  DomainName:
    Type: String
    Default: fixit.yourformsux.com
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the domain (must be in us-east-1 for CloudFront)
  StripeSecretKey:
    Type: String
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    NoEcho: true
  StripePriceBasic:
    Type: String
  StripePricePro:
    Type: String
  FirebaseProjectId:
    Type: String
  FirebaseClientEmail:
    Type: String
  FirebasePrivateKey:
    Type: String
    NoEcho: true
  SesFromEmail:
    Type: String
    Default: noreply@yourformsux.com
  AppUrl:
    Type: String
    Default: https://fixit.yourformsux.com
  # ── Marketing pipeline (blog + email) ──
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API key for AI blog/email drafting
  MarketingFromEmail:
    Type: String
    Default: yourformsux@gmail.com
    Description: Verified SES sender for marketing email (must be verified in SES)
  MarketingReplyTo:
    Type: String
    Default: yourformsux@gmail.com
  SuperAdminEmail:
    Type: String
    Default: ''
    Description: Optional email allowed to use marketing API even without an admin role doc

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
        STRIPE_PRICE_BASIC: !Ref StripePriceBasic
        STRIPE_PRICE_PRO: !Ref StripePricePro
        FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
        FIREBASE_CLIENT_EMAIL: !Ref FirebaseClientEmail
        FIREBASE_PRIVATE_KEY: !Ref FirebasePrivateKey
        ALLOWED_ORIGIN: !Sub 'https://${DomainName}'
        SES_FROM_EMAIL: !Ref SesFromEmail
        APP_URL: !Ref AppUrl

Resources:
  # ── S3 Bucket for static site ──
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${DomainName}-site'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ── CloudFront Origin Access Control ──
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${DomainName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront Function: resolve pretty URLs to prerendered index.html ──
  # Without this, /guides/<slug> hits S3 as a missing key → 403 → SPA fallback
  # serves the empty CSR shell, and prerendered pages are never seen by crawlers.
  # This rewrites directory/extensionless requests to the folder's index.html.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${DomainName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Append index.html for directory/extensionless requests (prerendered pages)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            // No file extension in the last path segment → treat as a page.
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # ── CloudFront Distribution ──
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # S3 origin for static files
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          # API Gateway origin for Lambda functions
          - Id: ApiOrigin
            DomainName: !Sub '${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # API routes → Lambda
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
          # Static assets with long cache
          - PathPattern: /assets/*
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            Compress: true
        # SPA fallback: serve index.html for all 404s
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # ── API Gateway (HTTP API) ──
  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${DomainName}'
          - 'http://localhost:5173'
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - stripe-signature
          - Authorization

  # ── Lambda Functions ──
  CreateCheckoutSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: create-checkout-session.handler
      CodeUri: ../lambda/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /api/create-checkout-session
            Method: POST

  CreatePortalSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: create-portal-session.handler
      CodeUri: ../lambda/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /api/create-portal-session
            Method: POST

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: stripe-webhook.handler
      CodeUri: ../lambda/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /api/stripe-webhook
            Method: POST

  # ── Email Notification Lambdas ──
  DailySummaryEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: daily-summary-email.handler
      CodeUri: ../lambda/
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)
            Description: Daily kiosk summary email to practitioners (midnight UTC / 8 PM ET)
            Enabled: true

  SessionReviewEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: session-review-email.handler
      CodeUri: ../lambda/
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /api/notify-review
            Method: POST

  UpdateLeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: update-leaderboard.handler
      CodeUri: ../lambda/
      Timeout: 60
      Events:
        LeaderboardSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(4 hours)
            Description: Update leaderboard rankings every 4 hours
            Enabled: true

  # ── DynamoDB: marketing / blog data (first tables in the stack) ──
  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fixit-subscribers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  EmailHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fixit-email-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: emailId
          AttributeType: S
      KeySchema:
        - AttributeName: emailId
          KeyType: HASH

  BlogPostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fixit-blog-posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH

  # ── Marketing API: blog drafting, email, subscribers (admin-authenticated) ──
  MarketingApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: marketing-api.handler
      CodeUri: ../lambda/
      Timeout: 60          # AI drafting + image processing can be slow
      MemorySize: 1024     # sharp image optimization needs headroom
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          EMAIL_HISTORY_TABLE: !Ref EmailHistoryTable
          BLOG_POSTS_TABLE: !Ref BlogPostsTable
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          MARKETING_FROM_EMAIL: !Ref MarketingFromEmail
          MARKETING_REPLY_TO: !Ref MarketingReplyTo
          SUPER_ADMIN_EMAIL: !Ref SuperAdminEmail
          SITE_BUCKET: !Sub '${DomainName}-site'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EmailHistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogPostsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !GetAtt SiteBucket.Arn
                - !Sub '${SiteBucket.Arn}/*'
      Events:
        # Admin routes (auth enforced inside the handler via Firebase ID token)
        Marketing:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /api/marketing/{proxy+}
            Method: ANY
        # Public: newsletter signup + one-click unsubscribe + open/click tracking
        Subscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /api/subscribe
            Method: POST
        Unsubscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /api/unsubscribe
            Method: GET

Outputs:
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Description: CloudFront Distribution ID (needed for cache invalidation)
  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: CloudFront domain — point your DNS CNAME here
  S3BucketName:
    Value: !Ref SiteBucket
    Description: S3 bucket for static site files
  ApiUrl:
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com'
    Description: API Gateway URL
