name: Deploy FIXIT to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: fixit.yourformsux.com-site

permissions:
  id-token: write
  contents: read

jobs:
  deploy-spa:
    name: Build & Deploy SPA to S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_BASIC: ${{ secrets.VITE_STRIPE_PRICE_BASIC }}
          VITE_STRIPE_PRICE_PRO: ${{ secrets.VITE_STRIPE_PRICE_PRO }}
          VITE_MARKETING_API_BASE: ${{ secrets.VITE_MARKETING_API_BASE }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # 1. Hashed assets & images → immutable long cache.
          #    Exclude all HTML (incl. prerendered guides/*/index.html) and the
          #    content files that must stay fresh.
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt" \
            --exclude "manifest.json"

          # 2. All HTML — root shell AND prerendered pages — must never be cached
          #    immutably, or a content change serves stale HTML for a year.
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} \
            --exclude "*" --include "*.html" \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"

          # 3. Sitemap/robots — short cache so new guides surface quickly.
          aws s3 cp dist/sitemap.xml s3://${{ env.S3_BUCKET }}/sitemap.xml \
            --cache-control "public, max-age=3600" || true
          aws s3 cp dist/robots.txt s3://${{ env.S3_BUCKET }}/robots.txt \
            --cache-control "public, max-age=3600" || true
          if [ -f dist/manifest.json ]; then
            aws s3 cp dist/manifest.json s3://${{ env.S3_BUCKET }}/manifest.json \
              --cache-control "no-cache"
          fi

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Submit to IndexNow for search indexing
        run: |
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "fixit.yourformsux.com",
              "key": "fixit2026indexnow",
              "urlList": [
                "https://fixit.yourformsux.com/",
                "https://fixit.yourformsux.com/guides",
                "https://fixit.yourformsux.com/guides/hyrox-training-guide-toronto",
                "https://fixit.yourformsux.com/guides/marathon-training-guide-gta-toronto",
                "https://fixit.yourformsux.com/guides/ironman-triathlon-training-ontario",
                "https://fixit.yourformsux.com/guides/learn-handstand-complete-guide",
                "https://fixit.yourformsux.com/guides/learn-backflip-progressive-guide",
                "https://fixit.yourformsux.com/guides/crossfit-beginners-guide-toronto",
                "https://fixit.yourformsux.com/guides/muscle-up-progression-guide",
                "https://fixit.yourformsux.com/guides/exercise-pain-management-guide-toronto",
                "https://fixit.yourformsux.com/guides/home-gym-setup-guide-toronto",
                "https://fixit.yourformsux.com/guides/ai-fitness-tracker-vs-personal-trainer"
              ]
            }'
          echo "IndexNow submitted"

  deploy-lambda:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lambda dependencies
        working-directory: lambda
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy Lambda functions
        working-directory: lambda
        run: |
          # Zip Lambda package
          zip -r ../lambda-package.zip . -x "*.git*"

          # Update each function
          for fn in fixit-create-checkout-session fixit-create-portal-session fixit-stripe-webhook fixit-daily-summary-email fixit-session-review-email fixit-update-leaderboard fixit-marketing-api; do
            aws lambda update-function-code \
              --function-name $fn \
              --zip-file fileb://../lambda-package.zip \
              --publish || echo "Function $fn not found — will be created by SAM"
          done
