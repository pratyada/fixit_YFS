name: Deploy FIXIT to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: fixit.yourformsux.com-site

permissions:
  id-token: write
  contents: read

jobs:
  deploy-spa:
    name: Build & Deploy SPA to S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_BASIC: ${{ secrets.VITE_STRIPE_PRICE_BASIC }}
          VITE_STRIPE_PRICE_PRO: ${{ secrets.VITE_STRIPE_PRICE_PRO }}
          VITE_MARKETING_API_BASE: ${{ secrets.VITE_MARKETING_API_BASE }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # 1. Hashed assets & images → immutable long cache.
          #    Exclude all HTML (incl. prerendered guides/*/index.html) and the
          #    content files that must stay fresh.
          #    NO --delete: content-hashed chunks are immutable, so keeping the
          #    previous build's chunks around is safe and CHEAP. Deleting them
          #    caused white screens — an already-open (or mid-deploy) session
          #    still references the old index.html, whose chunks would 404 the
          #    instant they were deleted. Old chunks are a few MB/deploy (pennies);
          #    prune manually if the bucket ever grows large.
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt" \
            --exclude "manifest.json"

          # 2. All HTML — root shell AND prerendered pages — must never be cached
          #    immutably, or a content change serves stale HTML for a year.
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} \
            --exclude "*" --include "*.html" \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"

          # 3. Sitemap/robots — short cache so new guides surface quickly.
          aws s3 cp dist/sitemap.xml s3://${{ env.S3_BUCKET }}/sitemap.xml \
            --cache-control "public, max-age=3600" || true
          aws s3 cp dist/robots.txt s3://${{ env.S3_BUCKET }}/robots.txt \
            --cache-control "public, max-age=3600" || true
          # llms.txt — AEO manifest for AI answer engines (served as text/plain).
          aws s3 cp dist/llms.txt s3://${{ env.S3_BUCKET }}/llms.txt \
            --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=3600" || true
          if [ -f dist/manifest.json ]; then
            aws s3 cp dist/manifest.json s3://${{ env.S3_BUCKET }}/manifest.json \
              --cache-control "no-cache"
          fi

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # Ensure the IndexNow key file is served as plain text (not the SPA shell),
      # otherwise IndexNow verification fails and all submissions are rejected.
      - name: Publish IndexNow key file
        run: |
          printf 'fixit2026indexnow' > /tmp/fixit2026indexnow.txt
          aws s3 cp /tmp/fixit2026indexnow.txt s3://${{ env.S3_BUCKET }}/fixit2026indexnow.txt \
            --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=86400" || true

      - name: Submit ALL sitemap URLs to IndexNow (Bing/Yandex)
        run: |
          # Build urlList from the generated sitemap so every page (incl. all
          # /exercise/ pages) is submitted and stays in sync automatically.
          URLS=$(grep -oE '<loc>[^<]+</loc>' dist/sitemap.xml | sed -E 's#</?loc>##g' \
            | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"fixit.yourformsux.com\",\"key\":\"fixit2026indexnow\",\"keyLocation\":\"https://fixit.yourformsux.com/fixit2026indexnow.txt\",\"urlList\":$URLS}"
          echo "IndexNow submitted $(echo "$URLS" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))') URLs"

  deploy-lambda:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lambda dependencies
        working-directory: lambda
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy Lambda functions
        working-directory: lambda
        run: |
          # Zip Lambda package
          zip -r ../lambda-package.zip . -x "*.git*"

          # Update each function
          for fn in fixit-create-checkout-session fixit-create-portal-session fixit-stripe-webhook fixit-daily-summary-email fixit-session-review-email fixit-update-leaderboard fixit-marketing-api; do
            aws lambda update-function-code \
              --function-name $fn \
              --zip-file fileb://../lambda-package.zip \
              --publish || echo "Function $fn not found — will be created by SAM"
          done
